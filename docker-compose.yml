services:
  bot:
    build: .
    container_name: saheli-dresses-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - WA_USER_DATA_DIR=/app/session-data
    volumes:
      - wa-session-data:/app/session-data

volumes:
  wa-session-data:
