services:
  - type: web
    name: saheli-dresses-bot
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: WA_SESSION_ID
        value: main
      - key: WA_PORT
        value: "8080"
      - key: SUPABASE_STORAGE_BUCKET
        value: broadcast-media
      - key: HISTORY_RETENTION_DAYS
        value: "30"
      - key: WAITLIST_NO_REPLY_HOURS
        value: "24"
      - key: WA_USER_DATA_DIR
        value: /app/session-data
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/status
    plan: starter
    disk:
      name: wa-session-data
      mountPath: /app/session-data
      sizeGB: 1